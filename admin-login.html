<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者登入 — 山宿 Homestay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(45, 74, 62, 0.9), rgba(45, 74, 62, 0.7)),
        url('https://images.unsplash.com/photo-1542718610-a1d656d1884c?w=1600&q=80') center/cover fixed;
      padding: 20px;
    }
    .login-card {
      background: var(--c-bg);
      width: 100%;
      max-width: 440px;
      padding: 48px 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-deep);
      animation: slideUp .5s ease;
    }
    .login-card .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-card .brand .logo {
      font-family: var(--font-display);
      font-size: 30px;
      color: var(--c-forest);
      letter-spacing: 4px;
      display: block;
      margin-bottom: 4px;
    }
    .login-card .brand .logo span { color: var(--c-clay); font-style: italic; }
    .login-card .brand small { color: var(--c-ink-soft); letter-spacing: 3px; font-size: 12px; }
    .login-card h2 { font-size: 24px; margin-bottom: 24px; text-align: center; }
    .login-card .btn { width: 100%; padding: 14px; font-size: 15px; }
    .login-back {
      text-align: center;
      margin-top: 16px;
    }
    .login-back a { font-size: 13px; color: var(--c-ink-soft); }
    .demo-tip {
      background: var(--c-cream);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--c-ink-soft);
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <span class="logo">山宿 <span>Homestay</span></span>
      <small>ADMIN PANEL</small>
    </div>
    <h2>管理者登入</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="btnLogin">登 入</button>
    <div class="login-back"><a href="index.html">← 回首頁</a></div>
    <div class="demo-tip">
      <strong>Demo 模式登入：</strong><br>
      Email: <code>admin@demo.com</code> ・ 密碼: <code>demo1234</code><br>
      （連接 Firebase 後請至 Firebase Console 建立管理者帳號）
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
